# Staging site on the host Nginx: serves the new app on a separate hostname
# while the existing site at the real domain keeps running untouched.
# Install:  sudo cp deploy/nginx/host-staging.conf /etc/nginx/sites-available/karaoke-staging
#           sudo ln -sf /etc/nginx/sites-available/karaoke-staging /etc/nginx/sites-enabled/karaoke-staging
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d 72-61-27-222.sslip.io      # adds HTTPS to this block automatically

server {
    listen 80;
    listen [::]:80;
    server_name 72-61-27-222.sslip.io;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
