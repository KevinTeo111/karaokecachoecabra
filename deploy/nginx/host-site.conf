# Site config for the Nginx installed on the VPS itself (apt package), which
# already terminates TLS with a Let's Encrypt certificate managed by certbot.
# Install:  sudo cp deploy/nginx/host-site.conf /etc/nginx/sites-available/karaoke
#           sudo ln -sf /etc/nginx/sites-available/karaoke /etc/nginx/sites-enabled/karaoke
#           sudo rm -f /etc/nginx/sites-enabled/default   # or the old site
#           sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name karaokecachoecabra.cl www.karaokecachoecabra.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://karaokecachoecabra.cl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name karaokecachoecabra.cl www.karaokecachoecabra.cl;

    ssl_certificate     /etc/letsencrypt/live/karaokecachoecabra.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karaokecachoecabra.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 5m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
