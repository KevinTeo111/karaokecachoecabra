# Production site on the host Nginx for karaokecec.cl. HTTP only on purpose:
# certbot adds the TLS server block and the HTTPS redirect itself.
# Install, once public DNS for karaokecec.cl resolves to this server:
#   sudo cp deploy/nginx/host-site.conf /etc/nginx/sites-available/karaoke
#   sudo ln -sf /etc/nginx/sites-available/karaoke /etc/nginx/sites-enabled/karaoke
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx --redirect -d karaokecec.cl -d www.karaokecec.cl

server {
    listen 80;
    listen [::]:80;
    server_name karaokecec.cl www.karaokecec.cl;

    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
